[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0

; ── FreeTAKServer core ──────────────────────────────────────────────────────
[program:fts]
command=/home/freetak/docker-run.sh
user=freetak
priority=10
autostart=true
autorestart=true
startretries=3
environment=HOME="/home/freetak"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── FreeTAKServer UI (Flask on port 5000) ─────────────────────────────────
; FTS_IP is overridden to 127.0.0.1 here because UI talks to FTS locally.
; The TAK-client-facing Tailscale IP comes from FTS_EXTERNAL_IP.
[program:fts-ui]
command=/home/freetak/ui-run.sh
user=freetak
priority=20
autostart=true
autorestart=true
startretries=5
environment=HOME="/home/freetak",FTS_IP="127.0.0.1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
