map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP defense in depth alongside the app's own per-account lockout
# (5 failed attempts / 15 min) — this catches distributed guessing across
# many usernames from one source, which the per-account lockout can't.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 443 ssl;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Most uploads (certs, plugins, XML map pointers) stay well under 100m —
    # this ceiling exists for .mbtiles offline tile packages, which run into
    # multiple gigabytes.
    client_max_body_size 6g;

    location = /auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # These three WebSocket routes carry a live JWT/ticket as a query-string
    # param (the WS handshake has no other place to put auth) — nginx's
    # default access_log records the full request URI, which would otherwise
    # write live bearer tokens into the log in plaintext.
    location ~ ^/(api/logs|api/health/stream|api/shell/ws)$ {
        access_log off;
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
