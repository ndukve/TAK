map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Per-IP defense in depth alongside the app's own per-account lockout
# (5 failed attempts / 15 min) — this catches distributed guessing across
# many usernames from one source, which the per-account lockout can't.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    # Unprivileged nginx cannot bind a port below 1024.
    listen 8443 ssl;
    server_tokens off;
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Most uploads (certs, plugins, XML map pointers) stay well under 100m —
    # this ceiling exists for .mbtiles offline tile packages, which run into
    # multiple gigabytes.
    client_max_body_size 6g;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.basemaps.cartocdn.com; font-src 'self'; connect-src 'self' wss://$host" always;

    location = /auth/login {
        client_max_body_size 16k;
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # These WebSocket routes carry a short-lived single-use ticket as a query
    # parameter (the WS handshake has no Authorization header) — nginx's
    # default access_log records the full request URI, which would otherwise
    # write live bearer tokens into the log in plaintext.
    location ~ ^/(api/logs|api/health/stream|api/shell/ws)$ {
        access_log off;
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    location ~ ^/auth/ {
        client_max_body_size 64k;
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://admin:8889;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
