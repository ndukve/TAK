[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by formatter judgment, not a hard error
    "B008",  # Depends(...) in argument defaults is FastAPI's actual DI pattern
]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
# Advisory only (see .github/workflows/python-lint.yml's mypy step: it
# reports but does not fail the build) — this codebase has zero prior
# type-check history. Baseline at introduction: 22 errors across 5 files,
# mostly "None has no attribute" on optional connection/task objects in
# api/replay_recorder.py and api/live_map.py — those read like real bugs,
# worth a look separately from this tooling addition.
ignore_missing_imports = true
