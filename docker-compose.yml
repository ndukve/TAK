services:

  freetakserver:
    build: .
    container_name: freetakserver
    # Tailscale runs on the host/LXC; Docker exposes ports on all interfaces.
    # Network security is enforced by Tailscale ACLs at the LXC level.
    ports:
      - "${COT_PORT:-8087}:8087"
      - "${SSL_COT_PORT:-8089}:8089"
      - "9000:9000"
      - "${API_PORT:-19023}:19023"
      - "${UI_PORT:-8090}:5000"
      - "8888:8888"
    volumes:
      - ${DATA_DIR:-/opt/fts}:/opt/fts/
    environment:
      # ── Ports ────────────────────────────────────────────────────────────
      FTS_COT_PORT:              ${COT_PORT:-8087}
      FTS_SSLCOT_PORT:           ${SSL_COT_PORT:-8089}
      FTS_API_PORT:              ${API_PORT:-19023}
      FTS_FED_PORT:              9000

      # ── External address (Tailscale IP — set in .env) ─────────────────
      FTS_DP_ADDRESS:            '${FTS_IP}'
      FTS_USER_ADDRESS:          '${FTS_IP}'
      FTS_API_ADDRESS:           '0.0.0.0'

      # ── Internal ZMQ routing ─────────────────────────────────────────
      FTS_ROUTING_PROXY_SUBSCRIBE_PORT:          19030
      FTS_ROUTING_PROXY_SUBSCRIBE_IP:            freetakserver
      FTS_ROUTING_PROXY_PUBLISHER_PORT:          19032
      FTS_ROUTING_PROXY_PUBLISHER_IP:            freetakserver
      FTS_ROUTING_PROXY_SERVER_PORT:             19031
      FTS_ROUTING_PROXY_SERVER_IP:               freetakserver
      FTS_INTEGRATION_MANAGER_PULLER_PORT:       19033
      FTS_INTEGRATION_MANAGER_PULLER_ADDRESS:    freetakserver
      FTS_INTEGRATION_MANAGER_PUBLISHER_PORT:    19034
      FTS_INTEGRATION_MANAGER_PUBLISHER_ADDRESS: freetakserver

      # ── Secrets (generated by install.sh) ────────────────────────────
      FTS_CLIENT_CERT_PASSWORD:  ${CERT_PASSWORD:-atakatak}
      FTS_WEBSOCKET_KEY:         ${FTS_WEBSOCKET_KEY}
      FTS_SECRET_KEY:            ${FTS_SECRET_KEY}
      FTS_FED_PASSWORD:          ${FTS_FED_PASSWORD}
      FTS_CONNECTION_MESSAGE:    ${FTS_CONNECTION_MESSAGE:-Connected to FreeTAKServer}

      # ── Performance ──────────────────────────────────────────────────
      FTS_OPTIMIZE_API:          "True"
      FTS_DATA_RECEPTION_BUFFER: 65535
      FTS_MAX_RECEPTION_TIME:    60
      FTS_NUM_ROUTING_WORKERS:   3
      FTS_COT_TO_DB:             "True"
      FTS_MAINLOOP_DELAY:        100
      FTS_EMERGENCY_RADIUS:      0
      FTS_LOG_LEVEL:             ${FTS_LOG_LEVEL:-info}

      # ── FreeTAKServer-UI ─────────────────────────────────────────────
      # FTS_IP for the UI process is overridden to 127.0.0.1 by supervisord
      # (UI talks to FTS on localhost inside the same container).
      FTS_API_PROTO:             http
      FTS_UI_PORT:               5000
      FTS_UI_EXPOSED_IP:         "0.0.0.0"
      FTS_MAP_EXPOSED_IP:        "127.0.0.1"
      FTS_MAP_PORT:              8000
      FTS_MAP_PROTO:             http
      FTS_UI_WSKEY:              ${FTS_WEBSOCKET_KEY}
      FTS_API_KEY:               "Bearer ${FTS_API_KEY}"
      FTS_UI_SQLALCHEMY_DATABASE_URI: "sqlite:////opt/fts/FTSServer-UI.db"
    restart: unless-stopped
