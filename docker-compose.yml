# Official TAK Server — 7-service deployment
# Build once: docker compose build
# Start: docker compose --env-file takserver.env up -d

x-tak: &tak-base
  image: takserver:local
  env_file: takserver.env
  volumes:
    - takserver_data:/opt/tak/data
  networks:
    - taknet
  restart: unless-stopped

services:

  # ── Local registry mirror (pull-through cache for Docker Hub) ────────────────
  # Every image below is referenced through this mirror, by exact digest —
  # builds source from here instead of hitting Docker Hub directly, and only
  # pick up upstream changes when someone explicitly re-pulls/re-pins a digest.
  # Must be up before any `docker compose build` — see update.sh/health.sh/
  # install.sh, which all start this first.
  registry:
    image: registry:2
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ./registry/config.yml:/etc/docker/registry/config.yml:ro
    restart: unless-stopped

  # ── Database ────────────────────────────────────────────────────────────────
  takdb:
    image: localhost:5000/postgis/postgis@sha256:a2fc46b52819d25add4ed93d3da83e106e17ea3ace6883cce3791631c9820bb2
    env_file: takserver.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cot}
      POSTGRES_USER: ${POSTGRES_USER:-martiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - takdb_data:/var/lib/postgresql/data
    networks:
      - taknet
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-martiuser} -d ${POSTGRES_DB:-cot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── First-run initialisation (certs + DB schema) ───────────────────────────
  takserver_initialization:
    <<: *tak-base
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    command: ["/bin/bash", "/opt/scripts/firstrun.sh"]
    depends_on:
      takdb:
        condition: service_healthy
    restart: "no"

  # ── Config service (TAK SSL CoT + HTTPS API) ───────────────────────────────
  takserver_config:
    <<: *tak-base
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "config"]
    ports:
      - "8089:8089"
      - "8443:8443"
      - "8087:8087"
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Messaging service (shares network namespace with config) ───────────────
  takserver_messaging:
    image: takserver:local
    env_file: takserver.env
    volumes:
      - takserver_data:/opt/tak/data
    restart: unless-stopped
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "messaging"]
    network_mode: "service:takserver_config"
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── API service (shares network namespace with messaging) ──────────────────
  takserver_api:
    image: takserver:local
    env_file: takserver.env
    volumes:
      - takserver_data:/opt/tak/data
    restart: unless-stopped
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "api"]
    network_mode: "service:takserver_messaging"
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Retention service (shares network namespace with messaging) ────────────
  takserver_retention:
    image: takserver:local
    env_file: takserver.env
    volumes:
      - takserver_data:/opt/tak/data
    restart: unless-stopped
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "retention"]
    network_mode: "service:takserver_messaging"
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Plugin manager (shares network namespace with messaging) ───────────────
  takserver_pluginmanager:
    image: takserver:local
    env_file: takserver.env
    volumes:
      - takserver_data:/opt/tak/data
      - tak_plugins:/opt/tak/plugins
      - tak_plugin_conf:/opt/tak/conf/plugins
    restart: unless-stopped
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "pm"]
    network_mode: "service:takserver_messaging"
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Docker socket proxy (scoped access for the admin panel) ──────────────
  # admin needs to list/inspect containers, exec into takserver_config (user
  # management scripts, shell tab), and read logs — nothing else. Rather than
  # mounting the raw host socket (which would let any compromise of the admin
  # app — a dependency CVE, an XSS-to-RCE chain, whatever — escalate straight
  # to `docker run --privileged -v /:/host` and full host root), only this
  # narrowly-scoped proxy touches the real socket. admin talks to it over TCP
  # on the internal network instead.
  docker_socket_proxy:
    image: localhost:5000/tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    environment:
      CONTAINERS: 1
      EXEC: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - taknet
    restart: unless-stopped

  # ── Admin panel (internal only — accessed via admin_proxy) ───────────────
  admin:
    build:
      context: ./admin
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file: takserver.env
    environment:
      DOCKER_HOST: tcp://docker_socket_proxy:2375
    volumes:
      - takserver_data:/opt/tak/data:rw
      - tak_plugins:/opt/tak/plugins:rw
      - ./packages/tak-maps:/opt/tak/maps:rw
      - /proc:/host/proc:ro
      - admin_ssl:/etc/nginx-ssl:ro
    networks:
      - taknet
    depends_on:
      takdb:
        condition: service_healthy
      takserver_initialization:
        condition: service_completed_successfully
      docker_socket_proxy:
        condition: service_started
    restart: unless-stopped

  # ── Admin TLS reverse proxy (port 8889 HTTPS) ────────────────────────────
  admin_proxy:
    image: localhost:5000/library/nginx@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    env_file: takserver.env
    volumes:
      - ./admin/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./admin/nginx/entrypoint.sh:/entrypoint.sh:ro
      - admin_ssl:/etc/nginx/ssl
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    ports:
      - "8889:443"
    networks:
      - taknet
    depends_on:
      - admin
    restart: unless-stopped

volumes:
  registry_data:
  takdb_data:
  takserver_data:
  tak_plugins:
  tak_plugin_conf:
  admin_ssl:

networks:
  taknet:
    driver: bridge
