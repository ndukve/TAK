# Local testing with host networking (use when bridge/veth is unavailable)
# Usage: docker compose -f docker-compose.host.yml --env-file takserver.env up -d
#
# WARNING: host networking removes all container network isolation — every
# service binds directly to every host interface, not just loopback/LAN.
# takdb is restricted to 127.0.0.1 below since nothing outside this host
# needs to reach it. The TAK services themselves (CoT/HTTPS/API ports) are
# intentionally left open on all interfaces — that's how remote ATAK/WinTAK
# clients and the admin panel reach them — but on any host with a public IP,
# firewall everything except the ports you actually intend to expose.

x-tak: &tak-base
  image: takserver:local
  env_file: ${TAK_ENV_FILE:-takserver.env}
  environment:
    ADMIN_SECRET_KEY: ""
    ADMIN_FIRST_USER: ""
    ADMIN_FIRST_PASS: ""
    OIDC_CLIENT_SECRET: ""
  volumes:
    - takserver_data:/opt/tak/data
  network_mode: host
  restart: unless-stopped

services:

  # ── Database ────────────────────────────────────────────────────────────────
  takdb:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cot}
      POSTGRES_USER: ${POSTGRES_USER:-martiuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - takdb_data:/var/lib/postgresql/data
    network_mode: host
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-martiuser} -d ${POSTGRES_DB:-cot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Migrate the bind-mounted data directory before the non-root TAK services
  # start.  This service has no network and exits immediately after chowning.
  tak_permissions:
    image: takserver:local
    user: "0:0"
    entrypoint: ["/bin/sh", "/opt/scripts/prepare_tak_volumes.sh"]
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - takserver_data:/opt/tak/data
    restart: "no"

  # ── First-run initialisation (certs + DB schema) ───────────────────────────
  takserver_initialization:
    <<: *tak-base
    command: ["/bin/bash", "/opt/scripts/firstrun.sh"]
    depends_on:
      takdb:
        condition: service_healthy
      tak_permissions:
        condition: service_completed_successfully
    restart: "no"

  # ── Config service (TAK SSL CoT + HTTPS API) ───────────────────────────────
  takserver_config:
    <<: *tak-base
    container_name: takserver_config
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "config"]
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Messaging service ──────────────────────────────────────────────────────
  takserver_messaging:
    <<: *tak-base
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "messaging"]
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── API service ─────────────────────────────────────────────────────────────
  takserver_api:
    <<: *tak-base
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "api"]
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Retention service ───────────────────────────────────────────────────────
  takserver_retention:
    <<: *tak-base
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "retention"]
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

  # ── Plugin manager ──────────────────────────────────────────────────────────
  takserver_pluginmanager:
    <<: *tak-base
    command: ["/bin/bash", "/opt/scripts/start-tak.sh", "pm"]
    depends_on:
      takserver_initialization:
        condition: service_completed_successfully

volumes:
  takdb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/tak-dbdata
  takserver_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /tmp/tak-data
