name: python-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse all admin/api Python files
        run: |
          python3 -c "
          import ast, pathlib
          for p in pathlib.Path('admin/api').rglob('*.py'):
              ast.parse(p.read_text(), filename=str(p))
          "
      - name: Install ruff
        run: pip install ruff==0.15.20
      - name: Ruff check
        run: ruff check .
        working-directory: admin
      - name: Type-check (advisory — reports only, does not fail the build)
        # See pyproject.toml's [tool.mypy] comment for why this isn't a gate
        # yet: no prior type-check history, 22-error baseline at introduction.
        run: pip install mypy && python -m mypy api || true
        working-directory: admin
