name: python-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Parse all admin/api Python files
        run: |
          python3 -c "
          import ast, pathlib
          for p in pathlib.Path('admin/api').rglob('*.py'):
              ast.parse(p.read_text(), filename=str(p))
          "
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
        working-directory: admin
