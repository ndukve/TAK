global
    log stdout format raw local0

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

frontend docker_api
    bind :2375

    # Docker SDK negotiation and liveness.
    acl discovery method GET
    acl discovery_path path_reg -i ^/(v[0-9.]+/)?(_ping|version)$

    # Read-only operations used by health, logs, and service lookup.
    acl read_method method GET HEAD
    acl list_path path_reg -i ^/v[0-9.]+/containers/json$
    acl inspect_path path_reg -i ^/v[0-9.]+/containers/[a-f0-9]+/json$
    acl logs_path path_reg -i ^/v[0-9.]+/containers/[a-f0-9]+/logs$
    acl exec_inspect_path path_reg -i ^/v[0-9.]+/exec/[a-f0-9]+/json$

    # Create execs only in the fixed TAK config container name. Allowing an
    # arbitrary ID would permit exec into this proxy and recover the socket.
    acl post_method method POST
    acl exec_create_path path_reg -i ^/v[0-9.]+/containers/takserver_config/exec$
    acl exec_start_path path_reg -i ^/v[0-9.]+/exec/[a-f0-9]+/start$

    http-request deny deny_status 403 unless discovery discovery_path or read_method list_path or read_method inspect_path or read_method logs_path or read_method exec_inspect_path or post_method exec_create_path or post_method exec_start_path
    default_backend docker_socket

backend docker_socket
    server docker /var/run/docker.sock
